name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the parity check reads the legacy page from efca179
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Public data guard (preview only, no workbook links, no premium rows)
        run: node tools/check-public.mjs
      - name: Delivery register (ops/entregas) is valid and append-only
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node --test tools/test-entregas.mjs && node tools/entregas.mjs --check --base "$BASE"
      - name: Preview export is current
        run: node tools/export-humanoids.mjs --check
      - name: Page is the verified build of the preview, with parity
        run: node tools/build-site.mjs --check
      - name: Premium app at whyhumanoid.com/app/ is the build of server/public
        run: node tools/build-app.mjs --check
      - name: Relations config matches the catalogue; the page links only public preview rows
        run: node tools/relations.mjs --check
      - name: Reports catalogue holds only verified bibliographic records and no private links
        run: node tools/reports-source.mjs --check
      - name: Robotics Evaluation Atlas snapshot holds allowlisted fields and counts that match its rows
        run: node tools/export-benchmarks.mjs --check
      - name: Robot Learning Data Atlas snapshot holds allowlisted fields and counts that match its rows
        run: node tools/export-datasets.mjs --check
      - name: Reviewed robot presentation (display name, cutout image, maker order link) matches the catalogue
        run: node tools/robot-presentation.mjs --check
      - name: Robot and company pages, sitemap and 404 are the build of public inputs
        run: node tools/build-pages.mjs --check && node tools/export-public.mjs --check
      - name: Headless render of the page
        working-directory: tools
        run: npm ci && node verify-site.mjs && node verify-premium-app.mjs && node verify-pages.mjs
      - name: API tests
        working-directory: server
        run: npm ci && npm test
