name: Import private workbook

on:
  workflow_dispatch:
    inputs:
      target:
        description: Cloudflare environment
        type: choice
        options: [test, production]
        default: test
        required: true
      scope:
        description: 'all = full import of every tab; deployments = only the Deployments graph tabs (Deployments, Clean Entities, Evidence Relations); stocks = only the Investment tab of listed companies; stocks-humanoids = the Investment and Humanoids tabs; the scoped ones write only what changed'
        type: choice
        options: [all, deployments, stocks, stocks-humanoids]
        default: all
        required: true
      dry_run:
        description: 'Scoped import only: compare and estimate D1 rows written, write nothing'
        type: boolean
        default: false
  # Nightly production import (03:17 UTC): switched on once Google accepts the production identity
  # (DEPLOYMENT.md 4.1). Until then it would fail every night.
  # schedule:
  #   - cron: '17 3 * * *'
  # Staging imports from the PR branch while this workflow is not on main yet (workflow_dispatch needs the file on
  # the default branch): a commit that changes .github/import-requests/test on feat/premium-preview runs a test import.
  push:
    branches: [feat/premium-preview]
    paths: ['.github/import-requests/test']

permissions:
  id-token: write
  contents: read

jobs:
  import:
    if: github.repository_id == '1456468940' && (github.ref == 'refs/heads/main' || (github.ref == 'refs/heads/feat/premium-preview' && (inputs.target == 'test' || github.event_name == 'push')))
    runs-on: ubuntu-latest
    environment: ${{ inputs.target || (github.event_name == 'push' && 'test') || 'production' }}
    concurrency: workbook-import-${{ inputs.target || (github.event_name == 'push' && 'test') || 'production' }}
    steps:
      # The reviewed relations config (aliases and the public robot index) comes from this commit and travels with the
      # import, so relations are rebuilt from the same rows every time. It holds public names only.
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Relations config from this commit
        run: |
          # A dry run exists only for the scoped import: never let it become a full import that writes.
          if [ "${{ inputs.dry_run == true }}" = true ] && [ "${{ inputs.scope || 'all' }}" = all ]; then
            echo "dry_run needs a scoped import (deployments, stocks or stocks-humanoids); nothing was imported"; exit 1
          fi
          node tools/relations.mjs --config | jq -c '{relations_config: .}' > relations-body.json
          # Scoped import (server/src/import/scoped.js): the Deployments graph tabs only, optionally as a dry run.
          if [ "${{ inputs.scope || 'all' }}" = deployments ]; then
            jq -c --argjson dry "${{ inputs.dry_run == true }}" '. + {datasets: ["deployments", "entities", "evidence-links"], dry_run: $dry}' relations-body.json > body.tmp && mv body.tmp relations-body.json
          fi
          # Scoped import of the Investment tab, alone or with Humanoids: their rows, identities and search documents;
          # relation graphs, company dossiers and every other tab untouched.
          if [ "${{ inputs.scope || 'all' }}" = stocks ]; then
            jq -c --argjson dry "${{ inputs.dry_run == true }}" '. + {datasets: ["stocks"], dry_run: $dry}' relations-body.json > body.tmp && mv body.tmp relations-body.json
          fi
          if [ "${{ inputs.scope || 'all' }}" = stocks-humanoids ]; then
            jq -c --argjson dry "${{ inputs.dry_run == true }}" '. + {datasets: ["stocks", "humanoids"], dry_run: $dry}' relations-body.json > body.tmp && mv body.tmp relations-body.json
          fi
          jq -c '{datasets, dry_run}' relations-body.json
          jq -r '"aliases: \(.relations_config.aliases.makers | length) makers, \(.relations_config.aliases.robots | length) robots; catalogue: \(.relations_config.catalogue | length) robots"' relations-body.json
      - name: Show the identity claims presented to Google (no token)
        run: |
          token=$(curl --fail --silent --show-error --header "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=claims-check" | jq -r .value)
          echo "::add-mask::$token"
          echo "$token" | cut -d. -f2 | tr '_-' '/+' | base64 -d 2>/dev/null \
            | jq '{sub, repository_id, workflow_ref, job_workflow_ref, ref, event_name, environment}' || true
      - name: Obtain read-only Google access token
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: whyhumanoid-importer@why-humanoid.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/spreadsheets.readonly
          create_credentials_file: false
          export_environment_variables: false
      - name: Import into Cloudflare D1
        # The Worker accepts this job's own GitHub OIDC token (audience whyhumanoid-premium-import) only for this
        # repository, this workflow, the Worker's GitHub environment and an allowed branch. No shared secret.
        # Only the import outcome, row counts and relation counts are printed; workbook data never reaches the log.
        env:
          TARGET: ${{ inputs.target || (github.event_name == 'push' && 'test') || 'production' }}
          GOOGLE_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          case "$TARGET" in
            test) worker=whyhumanoid-premium-test ;;
            production) worker=whyhumanoid-premium ;;
            *) exit 1 ;;
          esac
          test -n "$GOOGLE_ACCESS_TOKEN" || exit 1
          id_token=$(curl --fail --silent --show-error \
            --header "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=whyhumanoid-premium-import" | jq -r .value)
          echo "::add-mask::$id_token"
          test -n "$id_token" && test "$id_token" != null || exit 1
          status=$(curl --silent --show-error --max-time 180 --output result.json --write-out '%{http_code}' \
            --header "Authorization: Bearer $id_token" \
            --header "X-Google-Access-Token: $GOOGLE_ACCESS_TOKEN" \
            --header "Content-Type: application/json" --data @relations-body.json \
            --request POST "https://${worker}.javier-198.workers.dev/v1/admin/import")
          echo "HTTP $status"
          jq '{ok, error, warnings, counts, relations, search, scope, dry_run, changes, identities, estimated_rows_written, snapshot}' result.json || true
          rm -f result.json
          test "$status" = 200
