# Dispatch-only copy so GitHub can dispatch this workflow (workflow_dispatch needs the file on the default
# branch). Runs are dispatched with ref=feat/premium-preview and use that branch's file. The scheduled nightly
# production import arrives with PR #1, which replaces this file.
name: Import private workbook

on:
  workflow_dispatch:
    inputs:
      target:
        description: Cloudflare environment
        type: choice
        options: [test, production]
        default: test
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  import:
    if: github.repository_id == '1456468940' && (github.ref == 'refs/heads/main' || (github.ref == 'refs/heads/feat/premium-preview' && inputs.target == 'test'))
    runs-on: ubuntu-latest
    environment: ${{ inputs.target || 'production' }}
    concurrency: workbook-import-${{ inputs.target || 'production' }}
    steps:
      - name: Obtain read-only Google access token
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: whyhumanoid-importer@why-humanoid.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/spreadsheets.readonly
          create_credentials_file: false
          export_environment_variables: false
      - name: Import into Cloudflare D1
        # The Worker accepts this job's own GitHub OIDC token (audience whyhumanoid-premium-import) only for this
        # repository, this workflow, the Worker's GitHub environment and an allowed branch. No shared secret.
        # Only the import outcome and row counts are printed; workbook data never reaches the log.
        env:
          TARGET: ${{ inputs.target || 'production' }}
          GOOGLE_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          case "$TARGET" in
            test) worker=whyhumanoid-premium-test ;;
            production) worker=whyhumanoid-premium ;;
            *) exit 1 ;;
          esac
          test -n "$GOOGLE_ACCESS_TOKEN" || exit 1
          id_token=$(curl --fail --silent --show-error \
            --header "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=whyhumanoid-premium-import" | jq -r .value)
          echo "::add-mask::$id_token"
          test -n "$id_token" && test "$id_token" != null || exit 1
          status=$(curl --silent --show-error --max-time 180 --output result.json --write-out '%{http_code}' \
            --header "Authorization: Bearer $id_token" \
            --header "X-Google-Access-Token: $GOOGLE_ACCESS_TOKEN" \
            --request POST "https://${worker}.javier-198.workers.dev/v1/admin/import")
          echo "HTTP $status"
          jq '{ok, error, warnings, counts}' result.json || true
          rm -f result.json
          test "$status" = 200
