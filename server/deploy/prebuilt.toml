# Describes the PREBUILT single-file bundles (dist/worker.dashboard.js, dist/worker.staging.js) for Wrangler
# (ops/worker-deploy.md, section 3). Uploads them byte for byte (no_bundle); the only binding is D1. Dashboard vars are
# kept with --keep-vars; secrets are not part of a deploy.
# Runtime: the values the deployed versions actually run with, read by Codex with the Wrangler CLI on 27 Nov 2026
# (TEST 1ac00a70, PROD 8171c73c): compatibility_date 2026-11-13, no compatibility flags, usage model standard. They
# differ from server/wrangler.toml (2026-11-01, nodejs_compat), which describes the bundled local build, not the
# dashboard Workers. Read the runtime of the active version again before every upload and keep these values equal to
# it; a change of date or flags is a separate, reviewed decision.
compatibility_date = "2026-11-13"
compatibility_flags = []
no_bundle = true

[env.test]
name = "whyhumanoid-premium-test"
main = "../dist/worker.staging.js"
workers_dev = true
d1_databases = [
  { binding = "DB", database_name = "whyhumanoid-premium-test", database_id = "4cadeb6e-56ca-48e9-9adf-e666c4d2befd" },
]

[env.production]
name = "whyhumanoid-premium"
main = "../dist/worker.dashboard.js"
workers_dev = true
d1_databases = [
  { binding = "DB", database_name = "whyhumanoid-premium", database_id = "ba8ed181-22c6-40d4-b77d-f4bcbf238274" },
]
