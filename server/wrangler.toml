# Cloudflare Workers configuration: premium app (public/) and API on one origin.
# Two isolated environments. Each has its own D1 database, its own Stripe keys and its own webhook secret.
#   wrangler deploy --env test         -> whyhumanoid-premium-test   (Stripe test mode only)
#   wrangler deploy --env production   -> whyhumanoid-premium        (Stripe live mode, checkout off until enabled)
#
# Secrets per environment (wrangler secret put NAME --env test|production), never in this file or in Git:
#   STRIPE_SECRET_KEY      test env: sk_test_... or rk_test_...   production env: sk_live_... or rk_live_...
#   STRIPE_WEBHOOK_SECRET  whsec_... of that environment's webhook endpoint
#   RESEND_API_KEY         email provider for sign-in links
#   WORKBOOK_ID            id of the private master workbook
#   ADMIN_TOKEN            optional, manual import only
# Imports are keyless: .github/workflows/import-workbook.yml sends a short-lived read-only Google token and its
# GitHub OIDC token, checked against IMPORT_ENVIRONMENT. Google organisation policy blocks service-account keys,
# so GOOGLE_SA_EMAIL / GOOGLE_SA_PRIVATE_KEY stay unset and the Worker has no import cron.

name = "whyhumanoid-premium"
main = "src/worker.js"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
run_worker_first = ["/v1/*", "/health"]

[env.test]
# Deployed on 13 Nov 2026 from the dashboard (scripts/build-dashboard.mjs); these values match the dashboard settings.
name = "whyhumanoid-premium-test"
workers_dev = true
triggers = { crons = [] }  # imports run from GitHub Actions
d1_databases = [
  { binding = "DB", database_name = "whyhumanoid-premium-test", database_id = "4cadeb6e-56ca-48e9-9adf-e666c4d2befd", migrations_dir = "migrations" },
]

[env.test.vars]
IMPORT_ENVIRONMENT = "test"
STRIPE_MODE = "test"
CHECKOUT_ENABLED = "false"   # set to "true" once the test price is verified (EUR 10000 / year)
ALLOW_LIVE_CHECKOUT = "false"
STRIPE_PRICE_ID = "price_1UbL1PAcMngkWs5CH3IDosFb"  # Integrarobot test mode: "Why Humanoid? full database", EUR 100.00 / year (prod_VcaBEvd49gwki2)
ALLOWED_ORIGINS = "https://whyhumanoid-premium-test.javier-198.workers.dev"
PREMIUM_URL = "https://whyhumanoid-premium-test.javier-198.workers.dev/"
EMAIL_FROM = "Why Humanoid? test <onboarding@resend.dev>"  # Resend test sender: delivers only to the Resend account owner

[env.production]
# Created on 13 Nov 2026 from the dashboard; these values match the dashboard settings. It runs on workers.dev
# until whyhumanoid.com moves to Cloudflare DNS; then set workers_dev = false and add
# routes = [{ pattern = "premium.whyhumanoid.com", custom_domain = true }], and update the two URLs below.
name = "whyhumanoid-premium"
workers_dev = true
triggers = { crons = [] }  # imports run from GitHub Actions
d1_databases = [
  # EU jurisdiction (customer emails).
  { binding = "DB", database_name = "whyhumanoid-premium", database_id = "ba8ed181-22c6-40d4-b77d-f4bcbf238274", migrations_dir = "migrations" },
]

[env.production.vars]
IMPORT_ENVIRONMENT = "production"
STRIPE_MODE = "live"
CHECKOUT_ENABLED = "false"   # enabled only after the test lifecycle and the production checks pass
ALLOW_LIVE_CHECKOUT = "false"
STRIPE_PRICE_ID = "price_1UbOtjAcMngkWs5CR8qXNPGn"  # live: "Why Humanoid? full database", EUR 100.00 / year (prod_VceC4S2gQeLhOT)
ALLOWED_ORIGINS = "https://whyhumanoid-premium.javier-198.workers.dev"
PREMIUM_URL = "https://whyhumanoid-premium.javier-198.workers.dev/"
EMAIL_FROM = "Why Humanoid? <premium@whyhumanoid.com>"
